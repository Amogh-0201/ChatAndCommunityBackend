services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat_community_load
      POSTGRES_USER: load_test
      POSTGRES_PASSWORD: load_test_only_password
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U load_test -d chat_community_load"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - loadtest_db_data:/var/lib/postgresql/data
  
  api1:
    build: .
    environment:
      DATABASE_URL: "postgresql://load_test:load_test_only_password@db:5432/chat_community_load?schema=public"
      JWT_ACCESS_SECRET: "local-load-test-only-change-this-secret"
      JWT_ISSUER: "chat-community-load-test"
      JWT_AUDIENCE: "chat-community-load-test"
      PORT: "3000"
      REDIS_URL: "redis://redis:6379"
    healthcheck:
      test: 
        [
          "CMD", 
          "node", 
          "-e", 
          "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  api2:
    build: .
    environment:
      DATABASE_URL: "postgresql://load_test:load_test_only_password@db:5432/chat_community_load?schema=public"
      JWT_ACCESS_SECRET: "local-load-test-only-change-this-secret"
      JWT_ISSUER: "chat-community-load-test"
      JWT_AUDIENCE: "chat-community-load-test"
      PORT: "3000"
      REDIS_URL: "redis://redis:6379"
    healthcheck:
      test: 
        [
          "CMD", 
          "node", 
          "-e", 
          "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  api3:
    build: .
    environment:
      DATABASE_URL: "postgresql://load_test:load_test_only_password@db:5432/chat_community_load?schema=public"
      JWT_ACCESS_SECRET: "local-load-test-only-change-this-secret"
      JWT_ISSUER: "chat-community-load-test"
      JWT_AUDIENCE: "chat-community-load-test"
      PORT: "3000"
      REDIS_URL: "redis://redis:6379"
    healthcheck:
      test: 
        [
          "CMD", 
          "node", 
          "-e", 
          "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
      - api3

volumes:
  loadtest_db_data: