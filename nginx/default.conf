
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Normal HTTP API load balancing
upstream api_nodes {
    least_conn;

    server api1:3000 max_fails=3 fail_timeout=10s;
    server api2:3000 max_fails=3 fail_timeout=10s;
    server api3:3000 max_fails=3 fail_timeout=10s;
}

# Socket.IO load balancing with sticky sessions
upstream socket_nodes {
    ip_hash;

    server api1:3000 max_fails=3 fail_timeout=10s;
    server api2:3000 max_fails=3 fail_timeout=10s;
    server api3:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    # 1. Socket.IO traffic
    location /socket.io/ {
        proxy_pass http://socket_nodes;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;

        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # 2. Normal API traffic
    location /api/ {
        proxy_pass http://api_nodes;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Other HTTP endpoints (health checks, etc.)
    location / {
        proxy_pass http://api_nodes;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
